name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm exec --yes --package=bun@1.4.3 -- bun install --frozen-lockfile --ignore-scripts
      - name: Test
        run: npm exec --yes --package=bun@1.4.3 -- bun test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
